# The Shooting Star Addition: an unofficial addon for The Shooting Star (Forge 1.20.1).
# Values written as dollar-brace placeholders are filled in from gradle.properties when the jar is built.
# The mixins (optional touches inside The Shooting Star: the remote's cover animation, the caster's raised arm, the
# film overlay) are declared in the jar's manifest (MixinConfigs), as Forge 1.20.1 expects. If The Shooting Star
# changes, they simply switch themselves off; the skill keeps working.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "shooting_star_addition_icon.png"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The mod this addon adds a skill to. If a future version of The Shooting Star uses a different mod id
# (for example once it is no longer a demo), change shooting_star_mod_id in gradle.properties.
[[dependencies.${mod_id}]]
modId = "${shooting_star_mod_id}"
mandatory = true
versionRange = "${shooting_star_version_range}"
ordering = "AFTER"
side = "BOTH"
