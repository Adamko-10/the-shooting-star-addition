# The Shooting Star Addition: an unofficial addon for The Shooting Star (NeoForge 1.21.1).
# Values written as dollar-brace placeholders are filled in from gradle.properties when the jar is built.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "shooting_star_addition_icon.png"
description = '''${mod_description}'''

# Optional touches (the remote's cover animation, the caster's raised arm, the film overlay, the sky). If their
# targets change, these simply switch themselves off; the skills keep working.
[[mixins]]
config = "shooting_star_addition.mixins.json"

# The ones into The Shooting Star itself. The release jar has one of these per supported version of The Shooting Star
# (the build writes them in here), and only the running version's applies.
[[mixins]]
config = "shooting_star_addition.tss.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The mod this addon adds a skill to. If a future version of The Shooting Star uses a different mod id
# (for example once it is no longer a demo), change shooting_star_mod_id in gradle.properties.
[[dependencies.${mod_id}]]
modId = "${shooting_star_mod_id}"
type = "required"
versionRange = "${shooting_star_version_range}"
ordering = "AFTER"
side = "BOTH"
reason = "The Shooting Star Addition adds skills to The Shooting Star's Stellar Remote."
