// The Shooting Star Addition: an unofficial addon for The Shooting Star (NeoForge 1.21.1), built with ModDevGradle.
//
//   1. Put The Shooting Star's jar in libs/ (any file named the-shooting-star*.jar).
//   2. ./gradlew build        -> build/libs/shooting_star_addition-<version>.jar
//      ./gradlew runClient    -> a dev game with The Shooting Star and this addon loaded
//
// Versions live in gradle.properties.
plugins {
    id 'java-library'
    id 'idea'
    // any ModDevGradle 2.0.x works for NeoForge 1.21.1
    id 'net.neoforged.moddev' version '2.0.+'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
}

// A dev-only source set for the in-game screenshot harness used by the main session to look at an effect without a
// human (see src/clienttest). It is never built into the release jar and never loaded by the normal runs - only by
// the 'clientTest' run below, as its own second mod. Default conventions give it src/clienttest/java and
// src/clienttest/resources.
sourceSets {
    clienttest {}
}

// Captured so the 'runs' block below can restrict exactly which mods each run loads (otherwise every run would load
// every mod registered in 'mods', including the clienttest-only one).
var mainMod
var clientTestMod

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        ss05_clienttest {
            sourceSet(sourceSets.clienttest)
        }
    }
    mainMod = mods.getByName(mod_id)
    clientTestMod = mods.getByName('ss05_clienttest')

    runs {
        client {
            client()
            loadedMods.set([mainMod])
        }
        server {
            server()
            programArgument '--nogui'
            loadedMods.set([mainMod])
        }
        // Dev-only: ./gradlew runClientTest -Dss05.clienttest.skill=halley ...
        // Opens its own game directory (run/clienttest) with The Shooting Star, the addon and the harness mod
        // loaded, and drives a scripted cast + screenshots. See src/clienttest/java for the harness itself.
        clientTest {
            client()
            gameDirectory = layout.projectDirectory.dir('run/clienttest')
            loadedMods.set([mainMod, clientTestMod])
            systemProperty 'ss05.clienttest', 'true'
            // Forwarded straight from the Gradle invocation (-Dss05.clienttest.xxx=... works; Gradle re-applies
            // -D system properties on every build even when a daemon is reused) so the harness's parameters can
            // be changed without recompiling.
            ['skill', 'shots', 'view', 'time', 'distance', 'film', 'eat', 'hud', 'cam', 'land', 'final', 'world', 'power', 'damage', 'speed'].each { key ->
                var propertyName = "ss05.clienttest.${key}"
                var value = project.findProperty(propertyName) ?: System.getProperty(propertyName)
                if (value != null) {
                    systemProperty propertyName, value.toString()
                }
            }
        }
        prodClientTest {
            client()
            gameDirectory = layout.projectDirectory.dir('run/prodclient')
            loadedMods.set([])
            systemProperty 'ss05.clienttest', 'true'
            ['skill', 'shots', 'view', 'time', 'distance', 'film', 'eat', 'hud', 'cam', 'land', 'final', 'world', 'power', 'damage', 'speed'].each { key ->
                var propertyName = "ss05.clienttest.${key}"
                var value = project.findProperty(propertyName) ?: System.getProperty(propertyName)
                if (value != null) {
                    systemProperty propertyName, value.toString()
                }
            }
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

// The clienttest source set needs the Minecraft/NeoForge dependencies too (sourceSet(sourceSets.main) above gets
// these automatically as the plugin's primary source set; any other source set needs this explicitly).
neoForge.addModdingDependenciesTo(sourceSets.clienttest)

// The Shooting Star is compiled against but never shipped inside this jar (its licence is All Rights Reserved).
var shootingStar = fileTree(dir: 'libs', include: 'the-shooting-star*.jar')

// The Shooting Star 1.4.0+ is obfuscated: compile and run against a readable copy of the newest one in libs/, and
// make the release jar work with every one in libs/ (see gradle/tss.gradle).
ext.tssObf = shootingStar
ext.tssPrefix = 'cyou/rimuru/shootingstardemo/mc1211/'
ext.tssNested = null
apply from: 'gradle/tss.gradle'
tssPack(tasks.named('jar'))

// RimuLib (The Shooting Star 1.5.0+'s library, readable): compiled against, loaded in the dev runs, never shipped.
var rimulib = fileTree(dir: 'libs', include: 'rimulib*.jar')
if (rimulib.files.size() > 1) {
    throw new GradleException("libs/ has more than one RimuLib: ${rimulib.files*.name} - keep one")
}

dependencies {
    compileOnly tssNamed
    compileOnly rimulib
    clienttestCompileOnly rimulib
    // The harness sees main's classes (StarBridge, etc.) and compiles against The Shooting Star the same way.
    clienttestImplementation sourceSets.main.output
    clienttestCompileOnly tssNamed
}

// The dev runs load mods from a 'mods' folder next to their game directory, so The Shooting Star is copied there
// before every run. The clientTest run has its own game directory (run/clienttest), so it gets its own copy too.
// (Only one The Shooting Star at a time: a copy of another version left there from before is removed.)
var copyShootingStar = tasks.register('copyShootingStar', Sync) {
    from tssNamed, rimulib
    into layout.projectDirectory.dir('run/mods')
    preserve { exclude 'the-shooting-star*.jar', 'rimulib*.jar' }
}
var copyShootingStarForClientTest = tasks.register('copyShootingStarForClientTest', Sync) {
    from tssNamed, rimulib
    into layout.projectDirectory.dir('run/clienttest/mods')
    preserve { exclude 'the-shooting-star*.jar', 'rimulib*.jar' }
}
tasks.matching { it.name.startsWith('run') && it.name != 'runProdClientTest' }.configureEach {
    dependsOn copyShootingStar, copyShootingStarForClientTest
}

// Dev-only: ./gradlew runProdClientTest -Dss05.clienttest.skill=moon ... runs the harness against the *release* jar
// and The Shooting Star's own (obfuscated, 1.4.0+) jar, all loaded from run/prodclient/mods as players load them: the
// proof that tssPack mapped every reference back. -PtssTest=1.4.0 picks which of the jars in libs/ (default the newest).
var clienttestJar = tasks.register('clienttestJar', Jar) {
    from sourceSets.clienttest.output
    archiveClassifier = 'clienttest'
    destinationDirectory = layout.buildDirectory.dir('prodtest')
}
var reobfClienttest = tssReobf(clienttestJar, 'tssReobfClienttest', 'prodtest')
var copyProdMods = tasks.register('copyProdMods', Sync) {
    from tasks.named('tssPack'), reobfClienttest, tssTestJar, rimulib
    into layout.projectDirectory.dir('run/prodclient/mods')
}
tasks.matching { it.name == 'runProdClientTest' }.configureEach {
    dependsOn copyProdMods
}

tasks.named('compileJava') {
    doFirst {
        if (shootingStar.isEmpty()) {
            throw new GradleException("Put The Shooting Star's jar (the-shooting-star*.jar) in libs/ first - see libs/README.txt")
        }
    }
}

// neoforge.mods.toml is filled in from gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range    : minecraft_version_range,
        neo_version_range          : neo_version_range,
        loader_version_range       : loader_version_range,
        shooting_star_mod_id       : shooting_star_mod_id,
        shooting_star_version_range: tssVersionRange,
        rimulib_mod_id             : rimulib_mod_id,
        rimulib_version_range      : rimulib_version_range,
        mod_id                     : mod_id,
        mod_name                   : mod_name,
        mod_license                : mod_license,
        mod_version                : mod_version,
        mod_authors                : mod_authors,
        mod_description            : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
