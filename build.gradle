// The Shooting Star Addition: an unofficial addon for The Shooting Star (Forge 1.21.1), built with ForgeGradle 7.
//
//   1. Put The Shooting Star's jar in libs/ (any file named the-shooting-star*.jar).
//   2. ./gradlew build        -> build/libs/shooting_star_addition-<version>.jar
//      ./gradlew runClient    -> a dev game with The Shooting Star and this addon loaded
//
// Versions live in gradle.properties.
plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.23,8.0)'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// A dev-only source set for the in-game screenshot harness used by the main session to look at an effect without a
// human (see src/clienttest). It is never built into the release jar and never loaded by the normal runs - only by
// the 'clientTest' run below, as its own second mod. Default conventions give it src/clienttest/java and
// src/clienttest/resources.
sourceSets {
    clienttest {}
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        register('client') {
            workingDir = layout.projectDirectory.dir('run')
            mods {
                "${mod_id}" { source sourceSets.main }
            }
            // Dev-only: ./gradlew runClienttestClient -Dss05.clienttest.skill=halley ...
            // A clienttest-source-set-specific variant of this same run (its mainClass etc. come from 'client';
            // registering a brand-new run name instead has no mainClass to inherit, so this reuses 'client' via
            // SlimeLauncherOptions#with). Its own game directory (run/clienttest) and the harness mod drive a
            // scripted cast + screenshots. See src/clienttest/java for the harness itself.
            with(sourceSets.clienttest) {
                workingDir = layout.projectDirectory.dir('run/clienttest')
                mods {
                    "${mod_id}" { source sourceSets.main }
                    ss05_clienttest { source sourceSets.clienttest }
                }
                systemProperty 'ss05.clienttest', 'true'
                // Forwarded straight from the Gradle invocation (-Dss05.clienttest.xxx=... works; Gradle re-applies
                // -D system properties on every build even when a daemon is reused) so the harness's parameters can
                // be changed without recompiling.
                ['skill', 'shots', 'view', 'time', 'distance', 'film', 'eat'].each { key ->
                    var propertyName = "ss05.clienttest.${key}"
                    var value = project.findProperty(propertyName) ?: System.getProperty(propertyName)
                    if (value != null) {
                        systemProperty(propertyName, value.toString())
                    }
                }
            }
        }
        register('server') {
            workingDir = layout.projectDirectory.dir('run')
            args '--nogui'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    mavenLocal()
}

// The Shooting Star is compiled against but never shipped inside this jar (its licence is All Rights Reserved).
var shootingStar = fileTree(dir: 'libs', include: 'the-shooting-star*.jar')

// Resolved once; calling minecraft.dependency(...) a second time with the same coordinate (e.g. for the clienttest
// source set below) duplicates Mavenizer's internal task registration and fails the build, so the same
// MavenizerInstance is reused for every source set instead.
var forgeDependency = minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")

dependencies {
    implementation forgeDependency
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    compileOnly shootingStar
    // The harness sees main's classes (StarBridge, etc.) and compiles against The Shooting Star the same way.
    clienttestImplementation sourceSets.main.output
    clienttestImplementation forgeDependency
    clienttestCompileOnly shootingStar
}

// The dev runs load mods from a 'mods' folder next to their game directory, so The Shooting Star is copied there
// before every run. The clientTest run has its own game directory (run/clienttest), so it gets its own copy too.
var copyShootingStar = tasks.register('copyShootingStar', Copy) {
    from shootingStar
    into layout.projectDirectory.dir('run/mods')
}
var copyShootingStarForClientTest = tasks.register('copyShootingStarForClientTest', Copy) {
    from shootingStar
    into layout.projectDirectory.dir('run/clienttest/mods')
}
tasks.matching { it.name.startsWith('run') }.configureEach {
    dependsOn copyShootingStar, copyShootingStarForClientTest
}

tasks.named('compileJava') {
    doFirst {
        if (shootingStar.isEmpty()) {
            throw new GradleException("Put The Shooting Star's jar (the-shooting-star*.jar) in libs/ first - see libs/README.txt")
        }
    }
}

// mods.toml is filled in from gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range    : minecraft_version_range,
        forge_version_range        : forge_version_range,
        loader_version_range       : loader_version_range,
        shooting_star_mod_id       : shooting_star_mod_id,
        shooting_star_version_range: shooting_star_version_range,
        mod_id                     : mod_id,
        mod_name                   : mod_name,
        mod_license                : mod_license,
        mod_version                : mod_version,
        mod_authors                : mod_authors,
        mod_description            : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// Mixin wiring: Forge 1.21.1 runs with Mojang (official) names at runtime - no SRG, no refmap needed. The config is
// declared via the jar manifest (Forge 1.21.1 does not read [[mixins]] from mods.toml) and passed to the dev runs
// the same way.
tasks.named('jar', Jar) {
    manifest {
        attributes(['MixinConfigs': "${mod_id}.mixins.json"])
    }
}
minecraft.runs.configureEach {
    args "--mixin.config=${mod_id}.mixins.json"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
