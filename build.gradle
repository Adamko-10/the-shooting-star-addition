// The Shooting Star Addition: an unofficial addon for The Shooting Star (Fabric, Minecraft 26.3), built with Loom.
//
//   1. Put The Shooting Star's Fabric jar in libs/ (the file from its download page, the-shooting-star*.jar).
//   2. ./gradlew build        -> build/libs/shooting_star_addition-<version>.jar
//      ./gradlew runClient    -> a dev game with The Shooting Star and this addon loaded
//
// Versions live in gradle.properties. Minecraft 26.x is not obfuscated, so there are no mappings to set up.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

// Dev-only: the automated screenshot harness (see src/clienttest). Never built into the release jar, never loaded
// by the normal runs - only by the 'clientTest' run below, as its own second mod. Default conventions give it
// src/clienttest/java and src/clienttest/resources.
sourceSets {
    clienttest {}
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        ss05_clienttest {
            sourceSet sourceSets.clienttest
        }
    }
    runs {
        // Dev-only: ./gradlew runClientTest -Dss05.clienttest.skill=moon ...
        // Opens its own game directory (run/clienttest) with The Shooting Star, the addon and the harness mod
        // loaded, and drives a scripted cast + screenshots. See src/clienttest/java for the harness itself.
        clientTest {
            client()
            source sourceSets.clienttest
            runDir 'run/clienttest'
            property 'ss05.clienttest', 'true'
            // Forwarded straight from the Gradle invocation (-Dss05.clienttest.xxx=... works; Gradle re-applies
            // -D system properties on every build even when a daemon is reused) so the harness's parameters can
            // be changed without recompiling.
            ['skill', 'shots', 'view', 'time', 'distance', 'film', 'eat', 'hud', 'cam', 'land', 'final', 'world', 'power', 'damage', 'speed'].each { key ->
                var propertyName = "ss05.clienttest.${key}"
                var value = project.findProperty(propertyName) ?: System.getProperty(propertyName)
                if (value != null) {
                    property propertyName, value.toString()
                }
            }
        }
    }
}

// The Shooting Star is downloaded as one jar for several Minecraft versions, with its 26.3 build nested inside
// (META-INF/jars/...+mc26.3.jar): that inner jar is what the addon is compiled against and what the dev runs load
// (gradle/tss.gradle takes it out). The inner jar on its own in libs/ works too. libs/ holds one such jar per version of
// The Shooting Star the addon supports; none is ever shipped inside this jar (its licence is All Rights Reserved).
def shootingStarJars = fileTree(dir: 'libs', include: 'the-shooting-star*.jar')

// The Shooting Star 1.4.0+ is obfuscated: compile and run against a readable copy of the newest one in libs/, and
// make the release jar work with every one in libs/ (see gradle/tss.gradle).
ext.tssObf = shootingStarJars
ext.tssPrefix = 'cyou/rimuru/shootingstardemo/'
ext.tssNested = '+mc26.3'
apply from: 'gradle/tss.gradle'
tssPack(tasks.named('jar'))

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly tssNamed
    localRuntime tssNamed

    // The clienttest source set sees exactly what 'main' sees (Minecraft, Fabric, The Shooting Star), plus this
    // addon's own compiled classes (to call StarBridge/HalleyContent) - only 'main' gets Loom's modding
    // dependencies automatically, so its resolved classpaths are extended onto clienttest's directly.
    clienttestImplementation sourceSets.main.output
}
configurations {
    clienttestCompileClasspath.extendsFrom compileClasspath
    clienttestRuntimeClasspath.extendsFrom runtimeClasspath
}

tasks.named('compileJava') {
    def found = shootingStarJars
    doFirst {
        if (found.isEmpty()) {
            throw new GradleException("Put The Shooting Star's Fabric jar (the-shooting-star*.jar, with its Minecraft 26.3 build inside) in libs/ first - see libs/README.txt")
        }
    }
}

// fabric.mod.json is filled in from gradle.properties.
processResources {
    var replaceProperties = [
        version                    : project.mod_version,
        shooting_star_mod_id       : project.shooting_star_mod_id,
        shooting_star_versions     : tssVersionList.join('", "'),
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Dev-only: ./gradlew prodClientTest -Dss05.clienttest.skill=moon ... runs the clienttest harness against the
// *release* jar in a production-style game, with Fabric API and The Shooting Star's own (obfuscated, 1.4.0+) jar: the
// proof that tssPack mapped every reference back. Its game directory is run/prodclient. -PtssTest=1.4.0 picks which
// version of The Shooting Star in libs/ (default the newest).
configurations {
    prodMods {
        canBeConsumed = false
        transitive = false
    }
}
dependencies {
    prodMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
def clienttestJar = tasks.register('clienttestJar', Jar) {
    from sourceSets.clienttest.output
    archiveClassifier = 'clienttest'
    destinationDirectory = layout.buildDirectory.dir('prodtest')
}
def reobfClienttest = tssReobf(clienttestJar, 'tssReobfClienttest', 'prodtest')
tasks.register('prodClientTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    // setFrom: Loom adds the project's own jar by default, which here is the readable one in build/libs-raw
    mods.setFrom(tasks.named('tssPack'), reobfClienttest, configurations.prodMods, tssTestJar)
    runDir = file('run/prodclient')
    jvmArgs.add('-Dss05.clienttest=true')
    ['skill', 'shots', 'view', 'time', 'distance', 'film', 'eat', 'hud', 'cam', 'land', 'final', 'world', 'power', 'damage', 'speed'].each { key ->
        var propertyName = "ss05.clienttest.${key}"
        var value = project.findProperty(propertyName) ?: System.getProperty(propertyName)
        if (value != null) {
            jvmArgs.add("-D${propertyName}=${value}")
        }
    }
}
