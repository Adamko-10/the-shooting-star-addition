// The Shooting Star Addition: an unofficial addon for The Shooting Star (Fabric, Minecraft 26.3), built with Loom.
//
//   1. Put The Shooting Star's Fabric 26.3 jar in libs/ (any file named the-shooting-star*.jar).
//   2. ./gradlew build        -> build/libs/shooting_star_addition-<version>.jar
//      ./gradlew runClient    -> a dev game with The Shooting Star and this addon loaded
//
// Versions live in gradle.properties. Minecraft 26.x is not obfuscated, so there are no mappings to set up.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// The Shooting Star is compiled against and loaded in the dev runs, but never shipped inside this jar (its licence
// is All Rights Reserved).
var shootingStar = fileTree(dir: 'libs', include: 'the-shooting-star*.jar')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly shootingStar
    localRuntime shootingStar
}

tasks.named('compileJava') {
    doFirst {
        if (shootingStar.isEmpty()) {
            throw new GradleException("Put The Shooting Star's jar (the-shooting-star*.jar) in libs/ first - see libs/README.txt")
        }
    }
}

// fabric.mod.json is filled in from gradle.properties.
processResources {
    var replaceProperties = [
        version                    : project.mod_version,
        shooting_star_mod_id       : project.shooting_star_mod_id,
        shooting_star_version_range: project.shooting_star_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
