// The Shooting Star Addition: an unofficial addon for The Shooting Star (Fabric, Minecraft 1.20.1), built with Loom.
//
//   1. Put The Shooting Star's Fabric jar in libs/ (the file from its download page, the-shooting-star*.jar).
//   2. ./gradlew build        -> build/libs/shooting_star_addition-<version>.jar
//      ./gradlew runClient    -> a dev game with The Shooting Star and this addon loaded
//
// Versions live in gradle.properties. Unlike 26.x, Minecraft 1.20.1 is still obfuscated: Fabric mods (The Shooting
// Star's 1.20.1 build included) are published in intermediary names, so this is the classic remapping Loom plugin
// with Mojang's mappings, The Shooting Star goes through the mod* configurations (remapped for dev), and the release
// jar is remapped to intermediary with a mixin refmap.
plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

// Dev-only: the automated screenshot harness (see src/clienttest). Never built into the release jar, never loaded
// by the normal runs - only by the 'clientTest' run below, as its own second mod. Default conventions give it
// src/clienttest/java and src/clienttest/resources.
sourceSets {
    clienttest {}
}

loom {
    // (the render types HalleyRenderTypes makes need RenderType.create)
    accessWidenerPath = file('src/main/resources/shooting_star_addition.accesswidener')

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        ss05_clienttest {
            sourceSet sourceSets.clienttest
        }
    }
    runs {
        // Dev-only: ./gradlew runClientTest -Dss05.clienttest.skill=moon ...
        // Opens its own game directory (run/clienttest) with The Shooting Star, the addon and the harness mod
        // loaded, and drives a scripted cast + screenshots. See src/clienttest/java for the harness itself.
        clientTest {
            client()
            source sourceSets.clienttest
            runDir 'run/clienttest'
            property 'ss05.clienttest', 'true'
            // Forwarded straight from the Gradle invocation (-Dss05.clienttest.xxx=... works; Gradle re-applies
            // -D system properties on every build even when a daemon is reused) so the harness's parameters can
            // be changed without recompiling.
            ['skill', 'shots', 'view', 'time', 'distance', 'film', 'eat', 'hud', 'cam', 'land', 'final', 'world', 'power', 'damage', 'speed'].each { key ->
                var propertyName = "ss05.clienttest.${key}"
                var value = project.findProperty(propertyName) ?: System.getProperty(propertyName)
                if (value != null) {
                    property propertyName, value.toString()
                }
            }
        }
    }
}

// The Shooting Star is downloaded as one jar for several Minecraft versions, with its 1.20.1 build nested inside
// (META-INF/jars/...+mc1.20.1.jar): that inner jar is what the addon is compiled against and what the dev runs load
// (gradle/tss.gradle takes it out). The inner jar on its own in libs/ works too. libs/ holds one such jar per version
// of The Shooting Star the addon supports; none is ever shipped inside this jar (its licence is All Rights Reserved).
def shootingStarJars = fileTree(dir: 'libs', include: 'the-shooting-star*.jar')

// The Shooting Star 1.4.0+ is obfuscated: compile and run against a readable copy of the newest one in libs/, and
// make the release jar work with every one in libs/ (see gradle/tss.gradle).
ext.tssObf = shootingStarJars
ext.tssPrefix = 'cyou/rimuru/shootingstardemo/'
ext.tssNested = '+mc1.20.1'
apply from: 'gradle/tss.gradle'
tssPack(tasks.named('remapJar'))

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // the @Nullable the shared code marks things with (NeoForge and Forge bring it along; Fabric's Minecraft doesn't)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // Loom remaps mod dependencies while configuring: the readable copy is made right away (see gradle/tss.gradle)
    def tssNamedNow = tssVersions.isEmpty() ? files() : tssDeobfNow(tssVersions[0].jar)
    modCompileOnly tssNamedNow
    modLocalRuntime tssNamedNow

    // The clienttest source set sees exactly what 'main' sees (Minecraft, Fabric, The Shooting Star), plus this
    // addon's own compiled classes (to call StarBridge/HalleyContent) - only 'main' gets Loom's modding
    // dependencies automatically, so its resolved classpaths are extended onto clienttest's directly.
    clienttestImplementation sourceSets.main.output
}
configurations {
    clienttestCompileClasspath.extendsFrom compileClasspath
    clienttestRuntimeClasspath.extendsFrom runtimeClasspath
}

tasks.named('compileJava') {
    def found = shootingStarJars
    doFirst {
        if (found.isEmpty()) {
            throw new GradleException("Put The Shooting Star's Fabric jar (the-shooting-star*.jar, with its Minecraft 1.20.1 build inside) in libs/ first - see libs/README.txt")
        }
    }
}

// fabric.mod.json is filled in from gradle.properties.
processResources {
    var replaceProperties = [
        version                    : project.mod_version,
        shooting_star_mod_id       : project.shooting_star_mod_id,
        shooting_star_versions     : tssVersionList.join('", "'),
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

// Minecraft 1.20.1 runs on Java 17: the jar is compiled for it and the dev runs run on it (Gradle itself runs on the
// newer Java Loom needs).
tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '1000']
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Dev-only: ./gradlew prodClientTest -Dss05.clienttest.skill=moon ... runs the clienttest harness against the
// *release* jar in a production-style game (intermediary names, as players get it), with Fabric API and The
// Shooting Star's own 1.20.1 jar. The proof that Loom's in-place mixin remapping hooks everything (there is no
// refmap). Its game directory is run/prodclient. -PtssTest=1.4.0 picks which version of The Shooting Star in libs/
// (default the newest).
configurations {
    prodMods {
        canBeConsumed = false
        transitive = false
    }
}
dependencies {
    prodMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
def clienttestJar = tasks.register('clienttestJar', Jar) {
    from sourceSets.clienttest.output
    archiveClassifier = 'clienttest-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
def remapClienttestJar = tasks.register('remapClienttestJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = clienttestJar.flatMap { it.archiveFile }
    archiveClassifier = 'clienttest'
    destinationDirectory = layout.buildDirectory.dir('prodtest')
    classpath.from(sourceSets.clienttest.compileClasspath)
}
def reobfClienttest = tssReobf(remapClienttestJar, 'tssReobfClienttest', 'prodtest')
tasks.register('prodClientTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    // setFrom: Loom adds the project's own jar by default, which here is the one before tssPack (build/libs-raw)
    mods.setFrom(tasks.named('tssPack'), reobfClienttest, configurations.prodMods, tssTestJar)
    runDir = file('run/prodclient')
    jvmArgs.add('-Dss05.clienttest=true')
    ['skill', 'shots', 'view', 'time', 'distance', 'film', 'eat', 'hud', 'cam', 'land', 'final', 'world', 'power', 'damage', 'speed'].each { key ->
        var propertyName = "ss05.clienttest.${key}"
        var value = project.findProperty(propertyName) ?: System.getProperty(propertyName)
        if (value != null) {
            jvmArgs.add("-D${propertyName}=${value}")
        }
    }
}
