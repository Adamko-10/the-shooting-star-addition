// The Shooting Star Addition: an unofficial addon for The Shooting Star (Fabric, Minecraft 26.3), built with Loom.
//
//   1. Put The Shooting Star's Fabric jar in libs/ (the file from its download page, the-shooting-star*.jar).
//   2. ./gradlew build        -> build/libs/shooting_star_addition-<version>.jar
//      ./gradlew runClient    -> a dev game with The Shooting Star and this addon loaded
//
// Versions live in gradle.properties. Minecraft 26.x is not obfuscated, so there are no mappings to set up.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// The Shooting Star is downloaded as one jar for several Minecraft versions, with its 26.3 build nested inside
// (META-INF/jars/...+mc26.3.jar): that inner jar is what the addon is compiled against and what the dev runs load.
// The inner jar on its own in libs/ works too. Neither is ever shipped inside this jar (its licence is All Rights
// Reserved).
def shootingStarJars = fileTree(dir: 'libs', include: 'the-shooting-star*.jar').files.sort()
def extractShootingStar = tasks.register('extractShootingStar', Sync) {
    into layout.buildDirectory.dir('shooting-star')
    includeEmptyDirs = false
    shootingStarJars.each { jar ->
        if (jar.name.contains('+mc26.3')) {
            from(jar)
        } else {
            from(zipTree(jar)) {
                include 'META-INF/jars/*+mc26.3.jar'
                eachFile { it.relativePath = new RelativePath(true, it.name) }
            }
        }
    }
}
def shootingStar = files(extractShootingStar).asFileTree.matching { include '*.jar' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly shootingStar
    localRuntime shootingStar
}

tasks.named('compileJava') {
    def found = shootingStar
    doFirst {
        if (found.isEmpty()) {
            throw new GradleException("Put The Shooting Star's Fabric jar (the-shooting-star*.jar, with its Minecraft 26.3 build inside) in libs/ first - see libs/README.txt")
        }
    }
}

// fabric.mod.json is filled in from gradle.properties.
processResources {
    var replaceProperties = [
        version                    : project.mod_version,
        shooting_star_mod_id       : project.shooting_star_mod_id,
        shooting_star_version_range: project.shooting_star_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
