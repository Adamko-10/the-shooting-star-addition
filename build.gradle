// The Shooting Star Addition: an unofficial addon for The Shooting Star (Forge 1.20.1), built with ModDevGradle's
// legacy plugin.
//
//   1. Put The Shooting Star's jar in libs/ (any file named the-shooting-star*.jar; the Forge file carries the 1.20.1 build).
//   2. ./gradlew build        -> build/libs/shooting_star_addition-<version>.jar (reobfuscated to SRG names)
//      ./gradlew runClient    -> a dev game with The Shooting Star and this addon loaded
//
// Versions live in gradle.properties.
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.+'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// A dev-only game-logic test (src/servertest, mod id ss05_servertest): run with ./gradlew runServerTest. It is not
// part of the addon's jar.
// And a dev-only screenshot harness (src/clienttest, mod id ss05_clienttest): ./gradlew runClientTest
// -Dss05.clienttest.skill=halley|moon -Dss05.clienttest.shots=0,100,... -Dss05.clienttest.view=wide|aerial|low|far
// casts a skill in a fresh flat world and saves screenshots to run/clienttest/screenshots. Not part of the jar either.
sourceSets {
    servertest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    clienttest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    servertestCompileOnly.extendsFrom compileOnly
    servertestImplementation.extendsFrom implementation
    servertestRuntimeOnly.extendsFrom runtimeOnly
    clienttestCompileOnly.extendsFrom compileOnly
    clienttestImplementation.extendsFrom implementation
    clienttestRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    mavenLocal()
    // The user's own copy of The Shooting Star goes in libs/; the build compiles against a readable copy of it.
    // The Shooting Star, as the readable copy gradle/tss.gradle makes of it (see below)
    flatDir { dirs layout.buildDirectory.dir('shooting-star-named') }
}

legacyForge {
    // The same jar also runs on NeoForge 1.20.1 (which still reports itself as forge 47.1): ./gradlew -Pneoforge ...
    // builds and runs against NeoForge 1.20.1 instead, e.g. to run the servertest there with The Shooting Star's
    // NeoForge jar in libs/.
    if (project.hasProperty('neoforge')) {
        enable {
            neoForgeVersion = project.neoforge_version
        }
    } else {
        version = project.forge_version
    }
    addModdingDependenciesTo sourceSets.servertest
    addModdingDependenciesTo sourceSets.clienttest

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // (declared before the runs, which pick from them)
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        ss05_servertest {
            sourceSet(sourceSets.servertest)
        }
        ss05_clienttest {
            sourceSet(sourceSets.clienttest)
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods."${mod_id}"]
        }
        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods."${mod_id}"]
        }
        // A fresh world every time; the test casts SS-05 for real, checks what it did and stops the server.
        serverTest {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/servertest')
            systemProperty 'ss05.servertest', 'true'
            loadedMods = [mods."${mod_id}", mods.ss05_servertest]
        }
        // The screenshot harness: its own game directory, the addon and the harness mod loaded. The harness's
        // parameters are forwarded straight from the Gradle invocation (-Dss05.clienttest.xxx=...).
        clientTest {
            client()
            gameDirectory = project.file('run/clienttest')
            systemProperty 'ss05.clienttest', 'true'
            ['skill', 'shots', 'view', 'time', 'distance', 'film', 'hud', 'cam'].each { key ->
                var propertyName = "ss05.clienttest.${key}"
                var value = project.findProperty(propertyName) ?: System.getProperty(propertyName)
                if (value != null) {
                    systemProperty propertyName, value.toString()
                }
            }
            loadedMods = [mods."${mod_id}", mods.ss05_clienttest]
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

// Each test run starts from a fresh world and the test's own server.properties and addon config (src/servertest/server-setup).
// The Minecraft EULA is not accepted here: put eula.txt (eula=true) in run/servertest yourself.
tasks.matching { it.name == 'runServerTest' }.configureEach {
    doFirst {
        delete 'run/servertest/world'
        copy {
            from 'src/servertest/server-setup'
            into 'run/servertest'
        }
    }
}

// The Shooting Star is compiled against but never shipped inside this jar (its licence is All Rights Reserved).
// Its 1.20.1 classes use SRG names, so it goes through the remapping configurations, both to compile and for the dev runs.
var shootingStar = fileTree(dir: 'libs', include: 'the-shooting-star*.jar')

// The Shooting Star 1.4.0+ is obfuscated: compile and run against a readable copy of the newest one in libs/, and
// make the release jar work with every one in libs/ (see gradle/tss.gradle). The remapping configurations resolve
// the readable copy before any task runs, so it is made right away (tssDeobfNow).
ext.tssObf = shootingStar
ext.tssPrefix = 'cyou/rimuru/shootingstardemo/mc1201/'
ext.tssNested = null
apply from: 'gradle/tss.gradle'
tssPack(tasks.named('reobfJar'))
// (-PtssTest=1.3.4 picks another one for the dev runs: the client test runs against 1.3.4, as the dev client can't load
// 1.4's own mixins - they name their targets by SRG name, with no refmap to map them for a dev game)
var shootingStarNamed = tssVersions.isEmpty() ? files() : tssDeobfNow(tssTest.jar)

// Dev-only: the servertest mod as a real Forge 1.20.1 server loads it, to run the game-logic test against the *release*
// jar and The Shooting Star's own (obfuscated) jar. ./gradlew prodServerTestJars -PtssTest=1.4.0 writes
// build/prodtest/shooting_star_addition-<version>-servertest.jar: the test mod mapped to SRG names and to that version of
// The Shooting Star. Put it in a real Forge 1.20.1 server's mods folder with the release jar and that real jar, start the
// server with -Dss05.servertest=true and the files of src/servertest/server-setup, and grep its log for SS05TEST.
var servertestJar = tasks.register('servertestJar', Jar) {
    from sourceSets.servertest.output
    archiveClassifier = 'servertest'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
// (reobfuscate reads the source set's runtime elements, which a source set gets as a feature of the java component)
java {
    registerFeature('servertest') {
        usingSourceSet(sourceSets.servertest)
    }
}
var reobfServertestJar = obfuscation.reobfuscate(servertestJar, sourceSets.servertest)
var tssReobfServertest = tssReobf(reobfServertestJar, 'tssReobfServertest', 'prodtest')
tasks.register('prodServerTestJars') {
    dependsOn tasks.named('tssPack'), tssReobfServertest
}

dependencies {
    // The remapping configurations only take modules, so each jar is named as a flatDir module. It needs a group and a
    // version (any) for the remapping to match it; flatDir ignores the group and finds <name>.jar.
    shootingStarNamed.each { File jar ->
        var module = "local:${jar.name - '.jar'}:0"
        modCompileOnly module
        modRuntimeOnly module
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Forge 1.20.1 runs with SRG names, so the mixins need a refmap; and it reads mixin configs from the manifest only.
// The ones into The Shooting Star itself (shooting_star_addition.tss.mixins.json) use remap = false (TssPack rewrites
// their @Mixin target strings and method strings directly, per version), so they need no refmap entries of their own.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.tss.mixins.json"
}

tasks.named('jar', Jar) {
    // The tss config listed first: TssPack looks for its exact file name in the manifest's raw bytes before parsing
    // it, and the standard jar manifest format wraps long attribute lines at 72 bytes, which would otherwise split
    // that name across two lines.
    manifest.attributes(['MixinConfigs': "${mod_id}.tss.mixins.json,${mod_id}.mixins.json"])
}

tasks.named('compileJava') {
    doFirst {
        if (shootingStar.isEmpty()) {
            throw new GradleException("Put The Shooting Star's jar (the-shooting-star*.jar) in libs/ first - see libs/README.txt")
        }
    }
}

// mods.toml is filled in from gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range    : minecraft_version_range,
        forge_version_range        : forge_version_range,
        loader_version_range       : loader_version_range,
        shooting_star_mod_id       : shooting_star_mod_id,
        shooting_star_version_range: tssVersionRange,
        mod_id                     : mod_id,
        mod_name                   : mod_name,
        mod_license                : mod_license,
        mod_version                : mod_version,
        mod_authors                : mod_authors,
        mod_description            : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '1000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
