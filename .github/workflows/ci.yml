# Work-in-progress builds only (branches named wip/...): builds the addon on GitHub's machines, runs its tests and
# hands the jars back as a private draft release. The Shooting Star's jars are fetched for the run only and never kept.
name: ci
on:
  push:
    branches: ['wip/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build and test
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/ci.sh
