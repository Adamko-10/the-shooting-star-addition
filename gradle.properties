# ---------------------------------------------------------------------------------------------------------------
# The Shooting Star Addition - an unofficial addon for The Shooting Star (NeoForge 1.21.1)
# ---------------------------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.248
neo_version_range=[21.1,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The Shooting Star. Its jars go in libs/, one per supported version; the versions the addon accepts are made from
# them (gradle/tss.gradle).
shooting_star_mod_id=shooting_star_demo

# This addon
mod_id=shooting_star_addition
mod_name=The Shooting Star Addition
mod_license=All Rights Reserved
mod_version=1.5.0
mod_group_id=dev.shootingstaraddition
mod_authors=adamko_10
mod_description=An unofficial addon for The Shooting Star. Adds two skills to the Stellar Remote: SA-01 Halley and SA-02 Luna. Halley: a comet called down onto your crosshair. It comes in low over the horizon, ploughs a frozen trench toward your mark and detonates on it, leaving an icy crater with the comet's glowing heart standing in it. Luna: the moon itself falls on your crosshair, blasts out a huge crater and drives deep into it, and stays there, a moon of edible moon cheese with a molten heart. Power, damage and speed sliders like the original's skills. Optional: no cooldowns for every skill on the remote. Works with The Shooting Star (Demo) 1.3.3, 1.3.4, 1.4.0, 1.4.1, 1.4.2 and 1.4.3 on NeoForge 1.21.1.
