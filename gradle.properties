# ---------------------------------------------------------------------------------------------------------------
# The Shooting Star Addition - an unofficial addon for The Shooting Star (Forge 1.20.1)
# ---------------------------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft / Forge 1.20.1. The Shooting Star itself needs Forge 47.1 or newer.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=1.20.1-47.4.10
# Only for ./gradlew -Pneoforge (testing on NeoForge 1.20.1).
neoforge_version=1.20.1-47.1.106
forge_version_range=[47.1,)
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# The Shooting Star. Its jars go in libs/, one per supported version; the versions the addon accepts are made from
# them (gradle/tss.gradle).
shooting_star_mod_id=shooting_star_demo
# The oldest The Shooting Star the jar supports: 1.5.0 moved the skills, menu and films into RimuLib (older jars stay
# in libs/ for the mapping chain only). RimuLib's jar goes in libs/ too (rimulib-<ver>-<loader>.jar).
tss_min_version=1.5.2
rimulib_mod_id=rimulib
rimulib_version_range=[1.2.2,2.0)

# This addon
mod_id=shooting_star_addition
mod_name=The Shooting Star Addition: SA Series
mod_license=All Rights Reserved
mod_version=1.8.1
mod_group_id=dev.shootingstaraddition
mod_authors=adamko_10
mod_description=An unofficial addon for The Shooting Star (Demo). Adds four skills to the Stellar Remote: SA-01 Halley, a comet that ploughs a frozen trench and detonates on your crosshair; SA-02 Luna, the Moon itself falling onto your mark; SA-04 Proxima, a solar flare fired from a red dwarf 4.2 light years away; and SA-00 Stellar Convergence, every weapon at once. Power, damage and speed sliders like the original's skills. Needs The Shooting Star (Demo) 1.5.2 and RimuLib.
