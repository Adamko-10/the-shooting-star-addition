# ---------------------------------------------------------------------------------------------------------------
# The Shooting Star Addition - an unofficial addon for The Shooting Star (Forge 1.21.1)
# ---------------------------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Off: with ForgeGradle 7, a build that reuses the configuration cache writes a jar without classes (compileJava's
# output folder is only set while the build is configured).
org.gradle.configuration-cache=false

net.minecraftforge.gradle.merge-source-sets=true

# Minecraft / Forge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
forge_version=52.1.16
forge_version_range=[52,)
loader_version_range=[0,)

# The Shooting Star. Its jars go in libs/, one per supported version; the versions the addon accepts are made from
# them (gradle/tss.gradle).
shooting_star_mod_id=shooting_star_demo
# The oldest The Shooting Star the jar supports: 1.5.0 moved the skills, menu and films into RimuLib (older jars stay
# in libs/ for the mapping chain only). RimuLib's jar goes in libs/ too (rimulib-<ver>-<loader>.jar).
tss_min_version=1.5.0
rimulib_mod_id=rimulib
rimulib_version_range=[1.1.5,2.0)

# This addon
mod_id=shooting_star_addition
mod_name=The Shooting Star Addition
mod_license=All Rights Reserved
mod_version=1.6.0+forge-1.21.1
mod_group_id=dev.shootingstaraddition
mod_authors=adamko_10
mod_description=An unofficial addon for The Shooting Star. Adds two skills to the Stellar Remote: SA-01 Halley and SA-02 Luna. Halley: a comet called down onto your crosshair. It comes in low over the horizon, ploughs a frozen trench toward your mark and detonates on it, leaving an icy crater with the comet's glowing heart standing in it. Luna: the moon itself falls on your crosshair, blasts out a huge crater and drives deep into it, and stays there, a moon of edible moon cheese with a molten heart. Power, damage and speed sliders like the original's skills. Optional: no cooldowns for every skill on the remote. Works with The Shooting Star (Demo) 1.5.0 and RimuLib on Forge 1.21.1.
