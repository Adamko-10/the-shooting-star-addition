# ---------------------------------------------------------------------------------------------------------------
# The Shooting Star Addition - an unofficial addon for The Shooting Star (Forge 1.21.1)
# ---------------------------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

net.minecraftforge.gradle.merge-source-sets=true

# Minecraft / Forge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
forge_version=52.1.16
forge_version_range=[52,)
loader_version_range=[0,)

# The Shooting Star. Drop its jar into libs/ - the build picks up whatever the-shooting-star*.jar is there,
# so after an update you only swap the jar (and bump the range below if its version scheme changes).
shooting_star_mod_id=shooting_star_demo
shooting_star_version_range=[1.3.3,)

# This addon
mod_id=shooting_star_addition
mod_name=The Shooting Star Addition
mod_license=All Rights Reserved
mod_version=1.3.0+forge-1.21.1
mod_group_id=dev.shootingstaraddition
mod_authors=adamko_10
mod_description=An unofficial addon for The Shooting Star. Adds SS-05 Halley and SS-06 Luna to the Stellar Remote. SS-05: a comet called down onto your crosshair. It comes in low over the horizon, ploughs a frozen trench toward your mark and detonates on it, leaving an icy crater with the comet's glowing heart standing in it. SS-06: at night the moon itself falls on your crosshair and stays there, a moon of edible moon cheese with a molten heart. Made for The Shooting Star (Demo) 1.3.3 and newer (tested with 1.3.4) on Forge 1.21.1.
