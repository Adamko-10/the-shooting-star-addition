# ---------------------------------------------------------------------------------------------------------------
# The Shooting Star Addition - an unofficial addon for The Shooting Star (Fabric 26.3)
# ---------------------------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric (check these on https://fabricmc.net/develop)
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
fabric_api_version=0.162.0+26.3

# The Shooting Star. Drop its jar into libs/ - the build picks up whatever the-shooting-star*.jar is there,
# so after an update you only swap the jar (and bump the range below if its version scheme changes).
shooting_star_mod_id=shooting_star_demo
shooting_star_version_range=>=1.3.1-demo

# This addon
mod_id=shooting_star_addition
mod_name=The Shooting Star Addition
mod_version=1.1.0+fabric-26.3
maven_group=dev.shootingstaraddition
archives_base_name=shooting_star_addition
