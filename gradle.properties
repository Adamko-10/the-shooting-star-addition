# ---------------------------------------------------------------------------------------------------------------
# The Shooting Star Addition - an unofficial addon for The Shooting Star (Forge 1.20.1)
# ---------------------------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft / Forge 1.20.1. The Shooting Star itself needs Forge 47.1 or newer.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=1.20.1-47.4.10
forge_version_range=[47.1,)
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# The Shooting Star. Drop its jar into libs/ - the build picks up whatever the-shooting-star*.jar is there,
# so after an update you only swap the jar (and bump the range below if its version scheme changes).
shooting_star_mod_id=shooting_star_demo
shooting_star_version_range=[1.3.1,)

# This addon
mod_id=shooting_star_addition
mod_name=The Shooting Star Addition
mod_license=All Rights Reserved
mod_version=1.1.0+1.20.1
mod_group_id=dev.shootingstaraddition
mod_authors=adamko_10
mod_description=An unofficial addon for The Shooting Star. Adds SS-05 Halley to the Stellar Remote: a comet called down onto your crosshair. It comes in low over the horizon, ploughs a frozen trench toward your mark and detonates on it, leaving an icy crater with the comet's glowing heart standing in it. Made for The Shooting Star (Demo) 1.3.1 on Forge 1.20.1.
