# ---------------------------------------------------------------------------------------------------------------
# The Shooting Star Addition - an unofficial addon for The Shooting Star (Fabric, Minecraft 1.21.11)
# ---------------------------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric (check these on https://fabricmc.net/develop)
minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.18.4
fabric_api_version=0.141.6+1.21.11

# The Shooting Star. Its jars go in libs/, one per supported version; the versions the addon accepts are made from
# them (gradle/tss.gradle).
shooting_star_mod_id=shooting_star_demo
# The oldest The Shooting Star the jar supports: 1.5.0 moved the skills, menu and films into RimuLib (older jars stay
# in libs/ for the mapping chain only). RimuLib's jar goes in libs/ too (rimulib-<ver>-<loader>.jar).
tss_min_version=1.5.0
rimulib_mod_id=rimulib
rimulib_version_range=[1.1.5,2.0)

# This addon
mod_id=shooting_star_addition
mod_name=The Shooting Star Addition
mod_version=1.6.0+fabric-1.21.11
maven_group=dev.shootingstaraddition
archives_base_name=shooting_star_addition
